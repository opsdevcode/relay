apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-assistant
  namespace: relay
  labels:
    app.kubernetes.io/name: relay-assistant
    app.kubernetes.io/part-of: relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: relay-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay-assistant
    spec:
      containers:
        - name: relay-assistant
          image: ghcr.io/opsdevcode/relay-assistant:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: relay-assistant-secrets
            - configMapRef:
                name: relay-assistant-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
