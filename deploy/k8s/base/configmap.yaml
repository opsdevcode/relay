apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-assistant-config
  namespace: relay
data:
  ANTHROPIC_MODEL: claude-sonnet-4-20250514
  WEB_ORIGIN: https://portal.example.com
  GITHUB_ORG: opsdevcode
