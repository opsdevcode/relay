apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-web
  namespace: relay
  labels:
    app.kubernetes.io/name: relay-web
    app.kubernetes.io/part-of: relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: relay-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay-web
    spec:
      containers:
        - name: web
          image: ghcr.io/opsdevcode/relay-web:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
