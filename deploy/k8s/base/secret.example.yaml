apiVersion: v1
kind: Secret
metadata:
  name: relay-assistant-secrets
  namespace: relay
type: Opaque
stringData:
  # Pick one synthesis backend (see docs/local-setup.md and .env.example)
  LLM_PROVIDER: anthropic
  ANTHROPIC_API_KEY: replace-me
  # LLM_PROVIDER: azure_openai
  # AZURE_OPENAI_ENDPOINT: https://your-resource.openai.azure.com
  # AZURE_OPENAI_API_KEY: replace-me
  # AZURE_OPENAI_DEPLOYMENT: your-deployment
  DATABASE_URL: postgresql://portal:portal@postgres:5432/portal
  REDIS_URL: redis://redis:6379/0
  # Optional: enables POST /internal/reindex (docs/corpus-pipeline.md)
  INGEST_WEBHOOK_SECRET: replace-me
