apiVersion: v1
kind: Secret
metadata:
  name: relay-assistant-secrets
  namespace: relay
type: Opaque
stringData:
  ANTHROPIC_API_KEY: replace-me
  DATABASE_URL: postgresql://portal:portal@postgres:5432/portal
  REDIS_URL: redis://redis:6379/0
  # Optional: enables POST /internal/reindex (docs/corpus-pipeline.md)
  INGEST_WEBHOOK_SECRET: replace-me
