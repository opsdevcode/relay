apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target:
      kind: Ingress
      name: developer-portal
    patch: |
      - op: replace
        path: /spec/ingressClassName
        value: gce
      - op: add
        path: /metadata/annotations/kubernetes.io~1ingress.class
        value: gce
