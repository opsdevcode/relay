services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  relay-assistant:
    build:
      context: ..
      dockerfile: apps/relay-assistant/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql://portal:portal@postgres:5432/portal
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - ../knowledge/corpus:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - relay-assistant

  # Optional: `docker compose --profile backstage up` (see docs/local-compose.md).
  backstage:
    profiles: ["backstage"]
    build:
      context: ..
      dockerfile: deploy/backstage/Dockerfile.dev
    working_dir: /workspace/apps/backstage
    ports:
      - "3001:3001"
      - "7007:7007"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ..:/workspace:cached
      # TechDocs local builder (app-config: generator.runIn: docker)
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      relay-assistant:
        condition: service_started
      web:
        condition: service_started

volumes:
  postgres_data:
