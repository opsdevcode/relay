name: Conventional Commits

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  semantic-pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/ci-paths
        id: paths

      - name: Docs-only change (skip PR title lint)
        if: steps.paths.outputs.ci_needed != 'true'
        run: echo "No code changes outside docs-only paths; skipping semantic PR check."

      - name: Validate PR title (Conventional Commits)
        if: steps.paths.outputs.ci_needed == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9.-]+\))?(!)?: [a-z].+$'
          if ! printf '%s' "$PR_TITLE" | grep -qE "$pattern"; then
            echo "::error::PR title must follow Conventional Commits (type: lowercase subject)."
            echo "Title: $PR_TITLE"
            exit 1
          fi

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          node-version: "20"

      - uses: ./.github/actions/ci-paths
        id: paths

      - name: Docs-only change (skip commitlint)
        if: steps.paths.outputs.ci_needed != 'true'
        run: echo "No code changes outside docs-only paths; skipping commitlint."

      - name: Lint PR commits
        if: steps.paths.outputs.ci_needed == 'true'
        run: |
          set -euo pipefail
          npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19
          npx commitlint \
            --config .github/commitlint.config.mjs \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}"
