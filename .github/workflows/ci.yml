name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/relay-assistant
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/ci-paths
        id: paths

      - name: Docs-only change (skip tests)
        if: steps.paths.outputs.ci_needed != 'true'
        run: echo "No code changes outside docs-only paths; skipping test suite."

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        if: steps.paths.outputs.ci_needed == 'true'
        with:
          python-version: "3.12"

      - name: Install relay-assistant (dev)
        if: steps.paths.outputs.ci_needed == 'true'
        run: pip install --no-cache-dir -e ".[dev]"

      - name: Run tests
        if: steps.paths.outputs.ci_needed == 'true'
        env:
          PYTHONPATH: src
        run: python -m pytest -q
