name: Release

# Docs-only merges do not run the release job (see CONTRIBUTING.md).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/pull_request_template.md"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require release token
        run: |
          if [ -z "${{ secrets.PORTAL_RELEASE_TOKEN }}" ]; then
            echo "::error::PORTAL_RELEASE_TOKEN is not set. Run: gh secret set PORTAL_RELEASE_TOKEN --repo opsdevcode/ai-developer-portal"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.PORTAL_RELEASE_TOKEN }}

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install portal-assistant and semantic-release
        working-directory: apps/portal-assistant
        run: |
          pip install --no-cache-dir -e ".[dev]"
          pip install "python-semantic-release~=10.0"

      - name: Run tests
        working-directory: apps/portal-assistant
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Create GitHub release on conventional commits
        working-directory: apps/portal-assistant
        env:
          GH_TOKEN: ${{ secrets.PORTAL_RELEASE_TOKEN }}
        run: semantic-release version
