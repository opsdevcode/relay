name: Scaffold K8s Service

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: Service name (kebab-case, e.g. demo-api)
        required: true
        type: string
      description:
        description: Short service description
        required: false
        type: string
        default: Containerized service
      github_org:
        description: GitHub org for image/catalog slug
        required: false
        type: string
        default: opsdevcode
      owner:
        description: Backstage catalog owner (team name)
        required: false
        type: string
        default: platform-team

# Only the repository owner may run this workflow (see docs/security-governance.md).
permissions:
  contents: read

jobs:
  scaffold:
    if: github.actor == 'erskaggs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: scaffold-${{ github.actor }}
      cancel-in-progress: true
    steps:
      - name: Validate service name
        run: |
          name="${{ inputs.service_name }}"
          if ! echo "$name" | grep -Eq '^[a-z][a-z0-9-]{1,62}$'; then
            echo "service_name must be kebab-case (lowercase letters, numbers, hyphens)"
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Ensure target path is free
        run: |
          dest="examples/services/${{ inputs.service_name }}"
          if [ -e "$dest" ]; then
            echo "::error::Service already exists at $dest"
            exit 1
          fi

      - name: Render golden-path template
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          GITHUB_ORG: ${{ inputs.github_org }}
          DESCRIPTION: ${{ inputs.description }}
          OWNER: ${{ inputs.owner }}
          DEST: examples/services/${{ inputs.service_name }}
        run: |
          chmod +x scripts/render-k8s-service-template.sh
          ./scripts/render-k8s-service-template.sh

      - name: Verify catalog-info stamp
        run: |
          catalog="examples/services/${{ inputs.service_name }}/catalog-info.yaml"
          test -f "$catalog"
          grep -q 'relay.dev/scaffold-template: k8s-golden-path' "$catalog"
          grep -q 'relay.dev/scaffold-path: examples/services/${{ inputs.service_name }}' "$catalog"

      - name: Open pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: scaffold/${{ inputs.service_name }}
          delete-branch: true
          title: "scaffold: add ${{ inputs.service_name }} (k8s golden path)"
          commit-message: "scaffold: add ${{ inputs.service_name }}"
          body: |
            ## Summary
            Scaffold **`${{ inputs.service_name }}`** from the k8s-service golden path via Relay workflow dispatch.

            ## Inputs
            - **service_name:** `${{ inputs.service_name }}`
            - **description:** ${{ inputs.description }}
            - **github_org:** `${{ inputs.github_org }}`
            - **owner:** `${{ inputs.owner }}`

            ## Review checklist
            - [ ] `catalog-info.yaml` relay.dev scaffold stamp and Backstage owner look correct
            - [ ] Service name and catalog metadata look correct
            - [ ] K8s manifests fit your cluster conventions
            - [ ] CI/CD wiring added (if needed) before merge
