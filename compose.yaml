# Run from repo root:
#   docker compose up --build -d
#       → portal only: web :3000, API :8080 (Postgres/Redis internal)
#   docker compose --profile backstage up --build -d
#       → portal + Backstage UI :3001, Backstage backend :7007
#   COMPOSE_PROFILES=backstage docker compose up --build -d
#       → both (or uncomment COMPOSE_PROFILES in .env)
#
# Port reference: docs/local-compose.md#local-ports-docker-compose
#
# Equivalent to: docker compose -f deploy/docker-compose.yml …
include:
  - deploy/docker-compose.yml
